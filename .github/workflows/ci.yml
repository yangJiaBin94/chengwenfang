name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 + undici need Node 22+ (Node 20 hits markAsUncloneable)
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # .mvn/maven.config uses -s .mvn/settings.xml; public tree ships example only
      - name: Materialize Maven settings
        run: cp .mvn/settings.xml.example .mvn/settings.xml
      # Unit tests only; ChengwenfangIT / Testcontainers suites run locally with Docker.
      # argLine applies to Surefire forked JVM (Mockito inline mock maker on JDK 21+).
      # Fingerprint goldens hash source/catalog bytes and flake on CRLF vs LF across OSes.
      - name: Maven test (exclude IT)
        run: >
          mvn -B -pl chengwenfang-app -am test
          -Dsurefire.excludes=**/ChengwenfangIT.java,**/*IT.java,**/*IT$*.java,**/golden/fingerprint/**
          -DargLine=-XX:+EnableDynamicAgentLoading
