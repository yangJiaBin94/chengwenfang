name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests only; WorkbenchIT / Testcontainers suites run locally with Docker
      - name: Maven test (exclude IT)
        run: >
          mvn -B -pl workbench-app -am test
          -Dsurefire.excludes=**/WorkbenchIT.java,**/*IT.java,**/*IT$*.java
