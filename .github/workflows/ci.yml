name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 + undici need Node 22+ (Node 20 hits markAsUncloneable)
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    env:
      # Mockito mock() needs dynamic agent attach on JDK 21+ GHA runners
      MAVEN_OPTS: -XX:+EnableDynamicAgentLoading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # .mvn/maven.config uses -s .mvn/settings.xml; public tree ships example only
      - name: Materialize Maven settings
        run: cp .mvn/settings.xml.example .mvn/settings.xml
      # Unit tests only; WorkbenchIT / Testcontainers suites run locally with Docker
      - name: Maven test (exclude IT)
        run: >
          mvn -B -pl workbench-app -am test
          -Dsurefire.excludes=**/WorkbenchIT.java,**/*IT.java,**/*IT$*.java
