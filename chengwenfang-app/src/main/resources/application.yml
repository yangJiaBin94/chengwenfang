# 默认配置（开发环境）。启动：mvn -pl chengwenfang-app -am spring-boot:run

server:
  # 仅本机监听，避免开发机对外暴露
  address: 127.0.0.1
  port: 8001

spring:
  application:
    name: chengwenfang-app
  datasource:
    # 对应 compose.yml 中 mysql 服务
    url: jdbc:mysql://127.0.0.1:3306/chengwenfang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: chengwenfang
    password: chengwenfang_dev
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # 启动时自动执行 classpath:db/migration
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  jackson:
    # API JSON 使用 camelCase；时间写 ISO 字符串而非时间戳
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    # 表字段下划线 ↔ Java camelCase
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键由业务侧赋值（如 Ids.newId()），非数据库自增
      id-type: input

# 工作台自定义配置（ChengwenfangProperties）
chengwenfang:
  app-name: chengwenfang-backend
  app-version: 0.1.0
  environment: development
  # 密钥列 AES-GCM 主密钥；生产务必用环境变量 CHENGWENFANG_SECRET_KEY 覆盖
  secret-key: ${CHENGWENFANG_SECRET_KEY:chengwenfang-dev-secret-key-change-me!!}
  # 运行时目录：配图、日志缓存等（已 gitignore）
  runtime-dir: .chengwenfang
  # 进程内 Job Worker
  worker-enabled: true
  # 全局并发上限；与下方分类型槽同时生效
  worker-concurrency: 2
  worker-text-concurrency: 2
  worker-image-concurrency: 1
  worker-fetch-concurrency: 2
  # 任务租约秒数；过期可被重新认领
  worker-lease-seconds: 300
  worker-poll-seconds: 1.0
  # SSE 事件轮询间隔（秒）
  sse-poll-seconds: 0.5
  # 开发允许爬虫访问环回/私网（本地 SearXNG）；生产环境应保持 false
  crawler-allow-loopback: true
  # 文本 / 图像生成 / 多模态看图 单次上游调用超时（秒）
  ai-text-timeout-seconds: 120
  ai-image-timeout-seconds: 180
  ai-vision-timeout-seconds: 180
  # 雷达文章正文：Jina → Trafilatura → Lightpanda(可选) → 搜索摘要
  article-content:
    jina-enabled: true
    jina-base: https://r.jina.ai/
    jina-timeout-seconds: 20
    # 连不上 r.jina.ai 时尽快失败并回退 Trafilatura 原生爬取
    jina-connect-timeout-seconds: 5
    # 获取渠道阶段：直连探测死链的超时
    url-probe-timeout-seconds: 8
    trafilatura-enabled: true
    # Lightpanda：需 docker compose --profile lightpanda up -d
    browser-enabled: true
    browser-timeout-seconds: 45
    # docker-exec（Windows 推荐）| binary（本机 lightpanda 可执行文件）
    browser-mode: docker-exec
    browser-docker-container: chengwenfang-lightpanda
    browser-executable: lightpanda
    # 强防护/验证墙站点：跳过远端抓取（含浏览器），直接用搜索摘要（可按环境增删）
    skip-hosts:
      - toutiao.com
      - m.baidu.com
      - wenku.baidu.com
    per-host-concurrency: 2
  article-extract:
    enabled: true
    # 使用本目录 venv（含 trafilatura）；勿用系统 python
    python-executable: scripts/article-extract/.venv/Scripts/python.exe
    working-directory: scripts/article-extract
    step-timeout-seconds: 30
  # 资料池视频解析（本机 Python CLI：yt-dlp / ffmpeg / Whisper）
  video-transcript:
    enabled: true
    # 使用本目录 venv（含 yt-dlp / openai-whisper）；勿用系统 python
    python-executable: scripts/video-transcript/.venv/Scripts/python.exe
    working-directory: scripts/video-transcript
    step-timeout-seconds: 900
    max-per-topic: 20
    # 单次雷达采集同步解析的视频上限（文章上限见 RadarCollectQuotaDefaults）
    max-per-fetch: 10
    # 超过此时长（分钟）的视频在配额裁剪/解析前跳过；<=0 表示不限制
    max-duration-minutes: 30
    vision-max-frames: 12
    scene-threshold: 0.3
    fps-floor-seconds: 8
    dedup-diff-percent: 8
    dedup-window: 4
    frame-max-width: 1024
    # 本地解析产物（音频/视频/关键帧）保留天数；启动时与每小时清理超期目录
    work-dir-retain-days: 3
  # 微信公众号开放平台（测试可指向 WireMock）
  wechat-mp:
    api-base: https://api.weixin.qq.com
  # 全局线程池
  executor:
    # 渠道采集（Bean: channelFetchExecutor）
    channel-fetch:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
      keep-alive-seconds: 60
      thread-name-prefix: channel-fetch-
    # 雷达文章解析（Bean: radarArticleEnrichExecutor；拉正文 + 速览）
    radar-article-enrich:
      core-pool-size: 6
      max-pool-size: 8
      queue-capacity: 64
      keep-alive-seconds: 60
      thread-name-prefix: radar-article-
    # 雷达视频解析（Bean: radarVideoEnrichExecutor；Whisper/ffmpeg 偏重，与文章隔离）
    radar-video-enrich:
      core-pool-size: 5
      max-pool-size: 5
      queue-capacity: 32
      keep-alive-seconds: 60
      thread-name-prefix: radar-video-

# OpenAPI / Swagger UI（仅开发调试；prod 配置中关闭）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        # metrics：Job pending/running、租约回收、按 type 耗时等
        # prometheus：Micrometer Prometheus scrape（与现有 JobMetrics 并存）
        include: health,info,metrics,prometheus

logging:
  # 与 .mvn/jvm.config / scripts/use-utf8.ps1 对齐：默认跟 stdout.encoding（项目约定 UTF-8）
  charset:
    console: "${LOGGING_CHARSET_CONSOLE:${stdout.encoding:${native.encoding:UTF-8}}}"
  level:
    root: INFO
    com.chengwenfang: INFO
