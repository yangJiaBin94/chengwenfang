# 生产 Profile：--spring.profiles.active=prod
# 仅覆盖与开发不同的项；其余继承 application.yml

chengwenfang:
  environment: production
  worker-enabled: true
  # 生产必须显式提供密钥；未设置环境变量时启动失败（不继承开发默认值）
  secret-key: ${CHENGWENFANG_SECRET_KEY}
  # 生产禁止采环回（开发为本地 SearXNG 才开）
  crawler-allow-loopback: false

# 生产关闭 API 文档入口，避免对外暴露调试面
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产日志统一 UTF-8（容器 / Linux 采集）
logging:
  charset:
    console: UTF-8
