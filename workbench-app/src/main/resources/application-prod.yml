# 生产 Profile：--spring.profiles.active=prod
# 仅覆盖与开发不同的项；其余继承 application.yml

workbench:
  environment: production
  worker-enabled: true
  # 生产必须提供 WORKBENCH_SECRET_KEY；此处不设默认明文

# 生产关闭 API 文档入口，避免对外暴露调试面
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产日志统一 UTF-8（容器 / Linux 采集）
logging:
  charset:
    console: UTF-8
