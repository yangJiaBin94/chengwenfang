# Profile：满血热点 — 打开雷达正文瀑布与资料池视频解析
# 启动：--spring.profiles.active=hotnews-full
# 前置：scripts/article-extract 与 scripts/video-transcript 的 venv；
#       可选 docker compose --profile lightpanda；ffmpeg 在 PATH。

workbench:
  environment: hotnews-full
  video-transcript:
    enabled: true
  article-content:
    jina-enabled: true
    trafilatura-enabled: true
    browser-enabled: true
