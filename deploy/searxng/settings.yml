# SearXNG 本地实例配置（compose 只读挂载到 /etc/searxng/settings.yml）。
# 改此文件后执行：docker compose --profile searxng up -d --force-recreate searxng
#
# 策略：
# - 国内网页引擎开启（360 / 夸克 / 百度 / Bing / 搜狗）；视频站引擎关闭，避免资料补充被 B 站占满
# - 易拖垮整次搜索的海外网页引擎关闭（google cse / brave / duckduckgo / reuters …）
# - 若确需 Google 网页：将下方 google cse / google news 的 disabled 改为 false，并放宽 max_request_timeout
# - 百度/夸克若 CAPTCHA 挂起，仍可靠 Bing/360/搜狗出图文结果
# 完整选项：https://docs.searxng.org/admin/settings/settings.html
# 热点主题「非结构化」策略会按主要意图多轮调用本实例；结构化策略主要用主题渠道里的固定 queries
use_default_settings: true

general:
  instance_name: "Chengwenfang SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  # 本地开发用随机密钥；勿提交到生产公开实例
  secret_key: "d7a2fff0dd307d1736483fde6b5003f2"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  # 未单独声明 timeout 的引擎，单次 HTTP 用这个值。
  request_timeout: 6.0
  # 整次搜索的等待上限。不设时会取「被选中引擎里最大的 timeout」。
  # 360search 默认 timeout=20，会把同一次搜索里的 YouTube 等也拖满 20 秒，
  # 与成文坊客户端 20 秒读超时撞车，表现为 Read timed out。
  max_request_timeout: 6.0

engines:
  # —— 关闭：海外网页检索（国内易长时间超时）——
  - name: google cse
    disabled: true
  - name: google news
    disabled: true
  - name: brave
    disabled: true
  - name: brave.news
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: duckduckgo news
    disabled: true
  - name: reuters
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: yahoo
    disabled: true
  - name: qwant
    disabled: true
  - name: startpage
    disabled: true
  - name: mojeek
    disabled: true

  # —— 开启：国内引擎 ——
  - name: 360search
    disabled: false
    # 引擎自带 timeout=20，必须压到与 max_request_timeout 相同，否则会抬高整次搜索等待
    timeout: 6.0
  - name: quark
    disabled: false
  # 资料补充要图文/公告；B 站引擎打开后命中几乎全是视频，且业务侧还会屏蔽 bilibili.com
  - name: bilibili
    disabled: true
  - name: baidu
    disabled: false
  - name: baidu kaifa
    disabled: false
  - name: bing
    disabled: false
  - name: bing news
    disabled: false
  - name: sogou
    disabled: false

  # —— 关闭：视频引擎（与资料补充屏蔽视频站一致）——
  - name: youtube
    disabled: true
  - name: google videos
    disabled: true
  - name: dailymotion
    disabled: true
